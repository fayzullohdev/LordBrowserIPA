workflows:
  ios-swift-build:
    name: Build Unsigned iOS IPA
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Compile Swift File to IPA
        script: |
          mkdir -p Payload/LordBrowser.app
          
          # Swift faylingiz nomi ContentView.swift bo'lsa:
          swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
                 -target arm64-apple-ios15.0 \
                 -emit-executable \
                 -o Payload/LordBrowser.app/LordBrowser \
                 ContentView.swift
                 
          # Info.plist faylini yaratish
          cat <<EOF > Payload/LordBrowser.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>LordBrowser</string>
              <key>CFBundleIdentifier</key>
              <string>com.fayzulloh.lordbrowser</string>
              <key>CFBundleName</key>
              <string>LordBrowser</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF
          
          # Payload papkasini zip qilib .ipa hosil qilish
          zip -r LordBrowser.ipa Payload
          mkdir -p output
          mv LordBrowser.ipa output/
    artifacts:
      - output/*.ipagit commit -am "fix yaml"